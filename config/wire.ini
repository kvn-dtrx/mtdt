# ---
# title: Wire mounts for mtdt
# ---
# One mount per tree (dia-resources src/wire/WIRING.md).

# ---

[mount.lib]
from = src/wire/lib
root = "${MY_LOCAL_HOME}/lib/mtdt"
mode = symlink

[mount.bin]
from = src/wire/bin
root = "${MY_LOCAL_HOME}/bin"
mode = symlink

# Shared log-* helpers (dia: scripts/log-*); make-wire PATH-prepends this for stubs
[mount.libexec.logging]
from = src/wire/logging/libexec
root = "${MY_LOCAL_HOME}/libexec/logging"
mode = symlink
